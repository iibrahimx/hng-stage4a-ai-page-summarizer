<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Page Summarizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">AI Page Summarizer</h1>
        <p id="pageTitle" class="page-title">Loading page title...</p>
      </header>

      <main class="main">
        <div class="controls">
          <button id="summarizeBtn" class="btn btn-primary">
            <span id="btnText">Summarize Page</span>
            <span
              id="btnSpinner"
              class="spinner hidden"
              aria-hidden="true"
            ></span>
          </button>

          <button id="clearBtn" class="btn btn-secondary">Clear</button>
        </div>

        <!-- Settings Toggle -->
        <button
          id="settingsToggle"
          class="settings-toggle"
          aria-expanded="false"
        >
          <span>⚙️ Settings</span>
          <span id="toggleIcon" class="toggle-icon">▼</span>
        </button>

        <!-- Settings Panel -->
        <div id="settingsPanel" class="settings-panel hidden">
          <p class="setting-info">
            This extension works out of the box - no API key needed.
          </p>

          <div class="setting-group">
            <label for="summaryLength" class="setting-label"
              >Summary Length</label
            >
            <select id="summaryLength" class="setting-select">
              <option value="brief">Brief (3 points)</option>
              <option value="standard" selected>Standard (5 points)</option>
              <option value="detailed">Detailed (8 points)</option>
            </select>
          </div>

          <div class="setting-group">
            <label for="summaryTone" class="setting-label">Tone</label>
            <select id="summaryTone" class="setting-select">
              <option value="concise" selected>Concise</option>
              <option value="detailed">Detailed</option>
              <option value="simple">Simple</option>
            </select>
          </div>

          <div class="setting-actions">
            <button id="saveSettingsBtn" class="btn btn-primary btn-small">
              Save Settings
            </button>
            <button id="clearCacheBtn" class="btn btn-secondary btn-small">
              Clear Cache
            </button>
          </div>

          <div id="settingsMessage" class="settings-message hidden"></div>
        </div>

        <div
          id="readingTime"
          class="reading-time hidden"
          aria-live="polite"
        ></div>

        <div id="summaryContainer" class="summary-container" aria-live="polite">
          <div id="summaryOutput" class="summary-output"></div>
        </div>

        <div id="errorContainer" class="error-container hidden" role="alert">
          <p id="errorMessage" class="error-message"></p>
        </div>
      </main>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
